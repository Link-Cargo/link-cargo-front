name: Deploy Next.js with Docker to GCP

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/linkargo-web:latest
          build-args: |
            NEXT_PUBLIC_SERVER=${{ secrets.NEXT_PUBLIC_SERVER }}
            NEXT_PUBLIC_NEXT_SERVER=${{ secrets.NEXT_PUBLIC_NEXT_SERVER }}
            NEXT_PUBLIC_GAHCON_SERVER=${{ secrets.NEXT_PUBLIC_GAHCON_SERVER }}

      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_SERVER }}
          username: ${{ secrets.HOST_NAME }}
          key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/linkargo-web:latest
            docker stop linkargo-web || true
            docker rm linkargo-web || true
            docker run -d --name linkargo-web \
              -e TZ=Asia/Seoul \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/linkargo-web:latest
